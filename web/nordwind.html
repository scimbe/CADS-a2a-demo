<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nordwind Firmennetz</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<a class="skip" href="#go" data-i="skip">Zum Start-Button</a>
<header>
  <a id="back" class="back" href="https://demos-34a13a96.bunsenbrenner.org/">← Alle Demos</a>
  <h1 id="h1"></h1>
  <div class="bar">
    <span id="who" class="chip"></span>
    <button id="lang" type="button" class="ghost" aria-label="Sprache wechseln / switch language">EN</button>
  </div>
</header>
<main>
  <div id="banner" class="banner" role="status" hidden></div>
  <figure class="map">
    <svg id="map" viewBox="0 0 360 380" role="img" aria-labelledby="maptitle">
      <title id="maptitle"></title>
      <defs>
        <symbol id="i-desktop" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 20h8M12 16v4" stroke="currentColor" stroke-width="2" fill="none"/></symbol>
        <symbol id="i-server" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="4" y="14" width="16" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8" cy="6.5" r="1" fill="currentColor"/><circle cx="8" cy="17.5" r="1" fill="currentColor"/></symbol>
        <symbol id="i-gpu" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3" stroke="currentColor" stroke-width="2" fill="none"/></symbol>
        <symbol id="i-phone" viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M11 18.5h2" stroke="currentColor" stroke-width="2"/></symbol>
        <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18a4 4 0 0 1-.5-7.97A5.5 5.5 0 0 1 17 9a4.5 4.5 0 0 1 0 9z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
      </defs>
      <g id="edges"></g><g id="dots"></g><g id="nodes"></g>
    </svg>
    <figcaption id="legend" class="legend"></figcaption>
  </figure>
  <ul id="sr" class="sr-only"></ul>
  <div class="actions">
    <button id="go" type="button" class="primary"></button>
    <span id="status" role="status" aria-live="polite"></span>
  </div>
  <ol id="log" class="log" aria-live="polite" aria-label="Log"></ol>
  <details id="d-result"><summary id="s-result"></summary><div id="result"></div></details>
  <details id="d-crypto"><summary id="s-crypto"></summary><div id="crypto"></div></details>
  <details id="d-source"><summary id="s-source"></summary><div id="source"></div></details>
</main>
<footer class="support">
  <a class="brand" href="https://bunsenbrenner.org/"><span class="flame"></span>Bunsenbrenner<span class="tld">.org</span></a>
  <p id="support-note"></p>
  <div class="support-links">
    <a id="support-member" href="https://steady.page/plans/77a32d9c-c399-4ca1-9515-7a628c7a9413" target="_blank" rel="noopener"></a>

    <a href="https://github.com/scimbe/CADS-a2a-demo" target="_blank" rel="noopener">GitHub →</a>
  </div>

</footer>

</body>
</html>
