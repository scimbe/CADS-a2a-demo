# Demo: serve https://a2a-demo.bunsenbrenner.org through the Browser Plane, with a real
# Let's Encrypt certificate obtained CORE-side via deSEC DNS-01 (see README).
#
# Runs ALONGSIDE an already-running CADS-Tunnel plane. Adapt A2A_AGENT_EDGE/
# A2A_AGENT_CP_URL to your plane.
#
#   docker compose -f compose.a2a-demo.yml --env-file .env up --build -d
#
# `a2a-demo-alice` and `a2a-demo-bridge` (which spawns agent-bob per request) are two
# genuinely separate containers/images -- see provision.md for how their identities and
# the channel they both belong to were registered with the control plane, once, ahead
# of time. Both dial ONLY the shared plane's real edge broker/relay
# (A2A_CHANNEL_BROKER/A2A_CHANNEL_RELAY, e.g. edge:4435/edge:4436) -- neither service
# has the other's address, container name, or filesystem.
#
# Local-only smoke test (no tunnel, no cert) -- build/run the bridge image directly,
# do NOT use `docker compose up <one-service>` (Compose interpolates every service's
# required env vars up front, so a single-service `up` fails before it even starts --
# the same real gotcha CADS-auction-demo's README documents). This still needs a
# reachable edge broker/relay (real or a local CADS-Tunnel testbed) -- there is no
# fixture path anymore:
#   docker build -t a2a-demo-bridge .
#   docker run --rm --network ${PLANE_NETWORK:-ct-selfhost_default} -p 8790:8790 \
#     -e A2A_BOB_HOLDER_KEY=... -e A2A_BOB_NOISE_KEY=... -e A2A_BOB_GRANT=... \
#     -e A2A_BOB_HOLDER_PUBKEY=... -e A2A_CHANNEL_ID=... \
#     -e A2A_CHANNEL_BROKER=edge:4435 -e A2A_CHANNEL_RELAY=edge:4436 a2a-demo-bridge
# Bounded container log growth (host resource discipline, see docs.bunsenbrenner.org's
# `_reference/` for the plane's own disk-cap conventions): Docker's default `json-file`
# driver keeps every line forever unless capped. 10MB * 3 files = 30MB ceiling per
# container regardless of how long it's been running -- applied to all three services
# below via the anchor.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # a2a-demo-alice migrated OFF Docker, 2026-08-01: she used to run here, co-located with
  # the edge on the same host/Docker network, which meant her edge-observed reflexive
  # address could only ever be a private Docker IP -- the #104 direct-upgrade candidate
  # exchange (CT_CHANNEL_DIRECT_UPGRADE=1) could never offer a real address for her side,
  # no matter the config (see docs.bunsenbrenner.org/explanation/agent-fabric-channels/
  # for why). She now runs as a host-native systemd --user service
  # (~/.config/systemd/user/alice-a2a-demo.service on the plane host), with a real
  # CT_CHANNEL_LISTEN/CT_CHANNEL_ADVERTISE bound to the host's actual public IP, so her
  # reflexive address is genuinely global-unicast and the upgrade can actually succeed.
  # Alice.Dockerfile/alice-entrypoint.sh/handler-alice.sh are unchanged and still exactly
  # what the systemd service runs -- see /home/becke/alice-host/ on the plane host, a
  # verbatim copy extracted from this same Dockerfile's built image, not a fork.
  #
  # Deliberately NOT deleted from this repo: Alice.Dockerfile/alice-entrypoint.sh/
  # handler-alice.sh remain the source of truth for what the host-native service runs,
  # and re-adding this service block (matching provision.md's identity/env var names) is
  # the correct fallback if a future self-hoster wants Alice containerized again on a
  # deployment where co-location genuinely isn't a concern.

  a2a-demo-bridge:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - A2A_CHANNEL_BROKER=${A2A_CHANNEL_BROKER:?edge broker host:port, e.g. edge:4435}
      - A2A_CHANNEL_RELAY=${A2A_CHANNEL_RELAY:?edge relay host:port, e.g. edge:4436}
      - A2A_BOB_HOLDER_KEY=${A2A_BOB_HOLDER_KEY:?see provision.md}
      - A2A_BOB_NOISE_KEY=${A2A_BOB_NOISE_KEY:?see provision.md}
      - A2A_BOB_GRANT=${A2A_BOB_GRANT:?see provision.md}
      - A2A_BOB_HOLDER_PUBKEY=${A2A_BOB_HOLDER_PUBKEY:?see provision.md}
      - A2A_CHANNEL_ID=${A2A_CHANNEL_ID:?see provision.md}
      # TCP-:443 handover rung for agent-bob's spawned initiator -- fetched once at
      # startup from A2A_AGENT_CP_URL's /pki/ca, see BobIdentity::from_env in src/main.rs.
      - A2A_AGENT_CP_URL=${A2A_AGENT_CP_URL:?control-plane URL, needed to fetch the Mesh-Plane CA root for the TCP front-door handover}
      # #248: this bridge is a container on the plane's own compose network -- it needs
      # the edge's REAL bound port (8443, not the host-level "443:8443" Docker
      # port-publish, which only translates traffic entering from OUTSIDE Docker). See
      # run-demo.sh's own comment on CONTAINER_FRONT_DOOR for the full story.
      - A2A_CHANNEL_FRONT_DOOR=${A2A_CHANNEL_FRONT_DOOR:?edge front-door host:port -- e.g. edge:8443 when co-located on the plane's compose network, or <public-ip>:443 only for a genuinely external client}
      # bob-1/bob-2 real cross-network scenarios (#134-follow) -- all optional-by-design:
      # absent (default empty) means that scenario simply doesn't appear yet, not an
      # error (see PeerScenario::from_env / optional_env in src/main.rs). Provisioned
      # incrementally as intern/remote post their attestations, see CADS-Tunnel#248.
      - A2A_SCENARIOS_ALICE_HOLDER_KEY=${A2A_SCENARIOS_ALICE_HOLDER_KEY:-}
      - A2A_SCENARIOS_ALICE_NOISE_KEY=${A2A_SCENARIOS_ALICE_NOISE_KEY:-}
      - A2A_S_ALICE_BOB1_CHANNEL_ID=${A2A_S_ALICE_BOB1_CHANNEL_ID:-}
      - A2A_S_ALICE_BOB1_ALICE_GRANT=${A2A_S_ALICE_BOB1_ALICE_GRANT:-}
      - A2A_S_BOB1_HOLDER_PUBKEY=${A2A_S_BOB1_HOLDER_PUBKEY:-}
      - A2A_S_ALICE_BOB2_CHANNEL_ID=${A2A_S_ALICE_BOB2_CHANNEL_ID:-}
      - A2A_S_ALICE_BOB2_ALICE_GRANT=${A2A_S_ALICE_BOB2_ALICE_GRANT:-}
      - A2A_S_BOB2_HOLDER_PUBKEY=${A2A_S_BOB2_HOLDER_PUBKEY:-}
      - A2A_HEARTBEAT_TOKEN_BOB1=${A2A_HEARTBEAT_TOKEN_BOB1:-}
      - A2A_HEARTBEAT_TOKEN_BOB2=${A2A_HEARTBEAT_TOKEN_BOB2:-}
      # #248: operator/"core" secret for GET /logs/<peer|all> -- separate from each
      # peer's own heartbeat/monitor token (that one only ever unlocks that peer's own
      # buffered lines). Optional-by-design like everything else in this block: unset
      # means the core-wide endpoint is simply unavailable, not an error.
      - A2A_CORE_LOG_TOKEN=${A2A_CORE_LOG_TOKEN:-}
      # #248 live debugging (2026-08-01, high prio -- bob2 organizing a real debug
      # session with bob1): opt-in handshake-wait timing visibility, inherited by the
      # `ct-agent channel` initiator this bridge spawns per round (Command::env() adds
      # to the inherited parent environment, doesn't replace it -- see src/main.rs's
      # spawn call). Surfaces automatically as `initiator_log` SSE events (the bridge
      # already streams every line of the spawned initiator's stderr verbatim). Remove
      # once bob1's #248 thread is closed -- diagnostic-only.
      - CT_DEBUG_A2A_TIMING=1
    # No `ports:` mapping -- matches CADS-flappy-demo/CADS-cookbook-demo's own bridge
    # services, which never publish a host port either. This service was previously
    # published on 0.0.0.0:8790 (a real regression: plain HTTP, no TLS, publicly
    # reachable, bypassing Caddy/the edge entirely -- caught live on the production
    # host). The local-only smoke test in the header comment above still works via
    # `docker run -p 127.0.0.1:8790:8790 ...` against a one-off container, never a
    # host-wide port on the actual deployed service.
    # No depends_on: a2a-demo-alice anymore -- she's a host-native systemd service now
    # (see the migration comment at the top of this file), not something Compose can
    # express a dependency on. The bridge's own admission retry already tolerates her
    # being briefly unavailable at boot, same as it always has for any other peer.
    restart: unless-stopped
    logging: *default-logging

  a2a-demo-origin:
    build:
      context: .
      dockerfile: Caddy.Dockerfile
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${A2A_CERT_DIR:?set A2A_CERT_DIR=<dir with fullchain.pem+privkey.pem from the operator>}:/certs:ro
      - a2a_demo_caddy_data:/data
    expose:
      - "443"
    depends_on:
      - a2a-demo-bridge
    restart: unless-stopped
    logging: *default-logging

  a2a-demo-agent:
    build:
      context: .
      dockerfile: Agent.Dockerfile
      args:
        # #248 debug (2026-08-01): see Agent.Dockerfile's own comment.
        - CT_AGENT_REF=${CT_AGENT_REF:-fb5a799}
    environment:
      - CT_AGENT_MODE=browser
      - CT_AGENT_HOSTNAME=a2a-demo.bunsenbrenner.org
      - CT_AGENT_TOKEN=${A2A_AGENT_TOKEN:-}
      - CT_AGENT_ORIGIN=a2a-demo-origin:443
      - CT_AGENT_ORIGIN_PROTO=tcp
      - CT_AGENT_CAPABILITY_OUT=/tmp/capability.bin
      - CT_AGENT_EDGE=${A2A_AGENT_EDGE:?edge host:port, e.g. edge:4433}
      - CT_AGENT_CP_URL=${A2A_AGENT_CP_URL:?control-plane URL for onboarding}
      - CT_AGENT_JOIN_TOKEN=${A2A_JOIN_TOKEN:?single-use join token}
      - CT_AGENT_ID=a2a-demo
      - CT_AGENT_EDGE_CERT_URL=${A2A_AGENT_EDGE_CERT_URL:-}
      - CT_AGENT_STATE_DIR=/var/lib/ct-agent
      - CT_AGENT_RECONNECT_MAX_ATTEMPTS=0
    command: ["ct-agent", "onboard"]
    depends_on:
      - a2a-demo-origin
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - a2a_demo_agent_state:/var/lib/ct-agent

volumes:
  a2a_demo_caddy_data:
  a2a_demo_agent_state:

networks:
  default:
    name: ${PLANE_NETWORK:-ct-selfhost_default}
    external: true
