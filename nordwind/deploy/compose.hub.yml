# Cloud-Kern + public path for https://a2a-demo.bunsenbrenner.org (runs on ssh-united next to the plane).
# Replaces the old compose.a2a-demo.yml stack: same tunnel agent + Caddy origin pattern, new hub.
#
#   cp nordwind/deploy/hub.env.example nordwind/deploy/hub.env     # fill in, see RUNBOOK
#   docker compose -f nordwind/deploy/compose.hub.yml --env-file nordwind/deploy/hub.env up -d --build
#
# Needs: generated/hub.env (= generated/cloud.env, Cloud-Kern identity), generated/nodes.json (public),
#        a one-time tunnel join token (NW_JOIN_TOKEN) from the operator.
x-logging: &log {driver: json-file, options: {max-size: "10m", max-file: "3"}}
services:
  nordwind-hub:
    build: {context: ../.., dockerfile: nordwind/deploy/Dockerfile.hub, args: {CT_AGENT_REF: "${CT_AGENT_REF:-v0.7.24}"}}
    env_file: [generated/cloud.env]
    environment:
      - NW_CP_URL=${NW_CP_URL:-https://bunsenbrenner.org}
      - NW_OIDC_ISSUER=${NW_OIDC_ISSUER:?realm URL, e.g. https://auth.bunsenbrenner.org/realms/ct-demo}
      - NW_CP_CLIENT_ID=${NW_CP_CLIENT_ID:?service account of the account that owns the topology}
      - NW_CP_CLIENT_SECRET=${NW_CP_CLIENT_SECRET:?its secret}
      - NW_TOPOLOGY_ID=${NW_TOPOLOGY_ID:-}
      - NW_PUBLIC_URL=https://a2a-demo.bunsenbrenner.org
      - CT_CHANNEL_BROKER=${CT_CHANNEL_BROKER:-bunsenbrenner.org:4435}
      - CT_CHANNEL_RELAY=${CT_CHANNEL_RELAY:-bunsenbrenner.org:4436}
      - CT_CHANNEL_FRONT_DOOR=${CT_CHANNEL_FRONT_DOOR:-bunsenbrenner.org:443}
      - NW_FRONT_DOOR_ONLY=${NW_FRONT_DOOR_ONLY:-0}
    volumes: ["./generated/nodes.json:/etc/nordwind/nodes.json:ro"]
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
    logging: *log
    mem_limit: 192m
    cpus: 0.5
    # no `ports:` - reachable only through the origin below (a published port would bypass the login gate)

  nordwind-origin:
    build: {context: ../.., dockerfile: Caddy.Dockerfile}
    environment: ["CT_GATE_UPSTREAM_HOST=${CT_GATE_UPSTREAM_HOST:-bunsenbrenner.org}"]
    volumes: ["./Caddyfile.hub:/etc/caddy/Caddyfile:ro", "nordwind_caddy_data:/data"]
    expose: ["443"]
    depends_on: [nordwind-hub]
    restart: unless-stopped
    logging: *log
    mem_limit: 128m
    cpus: 0.5

  nordwind-agent:
    build: {context: ../.., dockerfile: Agent.Dockerfile, args: {CT_AGENT_REF: "${CT_AGENT_REF:-v0.7.24}"}}
    environment:
      - CT_AGENT_MODE=browser
      - CT_AGENT_FRAMED_FALLBACK=1
      - CT_AGENT_HOSTNAME=a2a-demo.bunsenbrenner.org
      - CT_AGENT_ORIGIN=nordwind-origin:443
      - CT_AGENT_ORIGIN_PROTO=tcp
      - CT_AGENT_CAPABILITY_OUT=/tmp/capability.bin
      - CT_AGENT_EDGE=${A2A_AGENT_EDGE:?edge host:port, e.g. edge:4433}
      - CT_AGENT_CP_URL=${NW_CP_URL:-https://bunsenbrenner.org}
      - CT_AGENT_JOIN_TOKEN=${NW_JOIN_TOKEN:?single-use join token from the operator (first start only)}
      - CT_AGENT_ID=a2a-demo
      - CT_AGENT_STATE_DIR=/var/lib/ct-agent
      - CT_AGENT_RECONNECT_MAX_ATTEMPTS=0
    command: ["ct-agent", "onboard"]
    volumes: ["nordwind_agent_state:/var/lib/ct-agent"]
    depends_on: [nordwind-origin]
    restart: unless-stopped
    logging: *log
    mem_limit: 128m
    cpus: 0.5

volumes:
  nordwind_caddy_data:
  nordwind_agent_state:

networks:
  default:
    name: ${PLANE_NETWORK:-ct-selfhost_default}
    external: true
